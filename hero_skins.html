<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero Skin Dioramas</title>
<style>
:root{--bg:#0b0c12;--card:#14171f;--line:#262b3a;--fg:#ece6dc;--mut:#8e93a4}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#0b0c12;--card:#14171f}}
:root[data-theme="dark"]{--bg:#0b0c12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 ui-monospace,Consolas,monospace;padding:24px 16px}
h1{font-size:18px;letter-spacing:.12em;margin:0 0 4px;text-align:center}p.s{color:var(--mut);text-align:center;margin:0 0 14px;font-size:12px}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:6px;flex-wrap:wrap}
.tabs button,.ctl button{font:inherit;color:var(--fg);background:#1a1d28;border:1px solid var(--line);padding:5px 12px;cursor:pointer}
.tabs button.on{border-color:#d4af37;color:#f0d060}
h2{font-size:12px;letter-spacing:.2em;color:var(--mut);margin:20px auto 10px;max-width:1180px}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;max-width:1180px;margin:0 auto}
.card{background:var(--card);border:2px solid #0b0a14;box-shadow:0 0 0 2px var(--tc),0 0 0 4px #0b0a14,0 12px 30px #000a}
canvas{display:block;width:100%;aspect-ratio:4/3;image-rendering:pixelated}
.bar{display:flex;justify-content:space-between;align-items:baseline;padding:8px 12px;border-top:2px solid #0b0a14}
.n{font-weight:700;letter-spacing:.05em}.t{font-size:11px;letter-spacing:.18em;color:var(--tc);text-transform:uppercase}
.ctl{display:flex;gap:8px;justify-content:center;margin-top:18px;color:var(--mut);font-size:12px;align-items:center}
</style></head><body>

let cls = 'KNIGHT', f = 0, run = true, cv = [];
function build() {
  const T = document.getElementById('tabs'); T.innerHTML = '';
  for (const k of Object.keys(CN)) { const b = document.createElement('button'); b.textContent = CN[k]; b.className = k === cls ? 'on' : ''; b.onclick = () => { cls = k; build(); }; T.appendChild(b); }
  const g = document.getElementById('g'); g.innerHTML = ''; cv = [];
  for (const [title, ts] of TIERS) { const items = LIST.map((d, i) => ({ ...d, i })).filter(d => d.cls === cls && ts.includes(d.tier)); if (!items.length) continue;
    const h = document.createElement('h2'); h.textContent = title; g.appendChild(h); const row = document.createElement('div'); row.className = 'row'; g.appendChild(row);
    for (const d of items) { const c = document.createElement('div'); c.className = 'card'; c.style.setProperty('--tc', TC[d.tier]);
      c.innerHTML = '<canvas width="64" height="48" aria-label="' + d.name + ' diorama"></canvas><div class="bar"><span class="n">' + d.name + '</span><span class="t">' + TN[d.tier] + '</span></div>'; row.appendChild(c); cv.push([c.querySelector('canvas'), d.i]); } }
  draw();
}
function draw() { if (!sheet.complete) return; for (const [c, i] of cv) { const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.clearRect(0, 0, 64, 48); x.drawImage(sheet, f * 64, i * 48, 64, 48, 0, 0, 64, 48); } document.getElementById('fl').textContent = 'frame ' + (f + 1) + '/4'; }
sheet.onload = draw; build();
setInterval(() => { if (run) { f = (f + 1) % 4; draw(); } }, 1000 / 6);
document.getElementById('pp').onclick = e => { run = !run; e.target.textContent = run ? 'Pause' : 'Play'; };
document.getElementById('st').onclick = () => { run = false; document.getElementById('pp').textContent = 'Play'; f = (f + 1) % 4; draw(); };
