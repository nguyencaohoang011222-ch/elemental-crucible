<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sharpshooter Showcase Card</title>
<style>
:root{--bg:#090c14;--card:#0f1320;--line:#222a3e;--fg:#e4ece4;--mut:#8a94a8;--acc:#6bff95;--gold:#c8a060}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#090c14;--card:#0f1320}}
:root[data-theme="dark"]{--bg:#090c14}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:14px/1.45 ui-monospace,Consolas,monospace;display:grid;place-items:center;padding:16px}
.card{width:min(100%,544px);background:var(--card);border:2px solid #0b0a14;box-shadow:0 0 0 2px var(--line),0 0 0 4px #0b0a14,0 20px 50px #000c}
canvas{display:block;width:100%;aspect-ratio:4/3;image-rendering:pixelated}
.bar{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;border-top:2px solid #0b0a14}
.n{font-weight:700;letter-spacing:.1em;color:var(--acc)}.t{color:var(--gold);font-size:12px;letter-spacing:.2em}
.ctl{display:flex;gap:8px;justify-content:center;margin-top:12px;color:var(--mut);font-size:12px}
button{font:inherit;color:var(--fg);background:#161c2c;border:1px solid var(--line);padding:4px 10px;cursor:pointer}
</style></head><body>
<div><div class="card"><canvas id="c" width="512" height="384" aria-label="Sharpshooter ranger idle diorama"></canvas>
<div class="bar"><span class="n">SHARPSHOOTER</span><span class="t">RANGER</span></div></div>
<div class="ctl"><button id="pp">Pause</button><button id="st">Step</button><span id="fl">frame 1/4</span></div></div>
<script>
// Everything is drawn into ONE 64×48 buffer (1 cell = 1 pixel), then scaled ×8 with smoothing off.
const GW = 64, GH = 48, FLOOR = 36;
const PAL = {
  '0': '#0b0a14', // outline
  '1': '#09080f', // contact shadow
  '2': '#0a0f1c', // far sky
  '3': '#101626', // forest silhouette
  '4': '#18203a', // nearer trees / moonlit edge
  'M': '#c8d4ff', // moon / moonlight rim
  'm': '#6a78a8', // moon shade, stars
  '5': '#191c22', // floor mortar
  '6': '#2a2d32', // floor stone
  '7': '#3a3e44', // floor stone top edge
  'Q': '#24331f', // moss dark
  'q': '#38502c', // moss
  'H': '#173d22', // cloak shadow
  'h': '#26683a', // cloak green
  'j': '#3f9a52', // cloak light
  'B': '#6bff95', // emerald glow rim
  'K': '#09080f', // hood face shadow
  'Y': '#c8ff6a', // narrowed glowing eyes
  'N': '#4a2a14', // leather shadow
  'n': '#7a4826', // jerkin leather
  'l': '#a86e3c', // leather light
  'r': '#1e120a', // strap / belt
  'S': '#252a34', // pants
  's': '#363d4a', // pants light
  'X': '#10281a', // scarf shadow
  'x': '#1c4428', // scarf
  'U': '#5a3418', // quiver
  'V': '#e8e0d0', // fletching
  'R': '#b83a2c', // fletching red
  'P': '#e8b88a', // face skin
  'p': '#b8845e', // face shade
  'G': '#c8a060', // buckle
  'w': '#5a3418', // bow wood shadow
  'W': '#9a6a34', // bow wood
  'Z': '#cfe0c8', // bowstring
  'E': '#ffffff', // arrow core
  'F': '#163a2c', // floor glow dim
  'f': '#2a7a4e', // floor glow bright
  'v': '#9ad8a8', // wind streak
  'e': '#4a9a4a', // leaf
};
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const dth = (x, y, t) => t * 16 > BAY[((y & 3) << 2) | (x & 3)] + 0.5;
const hsh = (a, b) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

// ---------- Ranger sprite (hand-authored matrix, faces right, crouched; '.' = empty) ----------
// hood: compact rounded shape on its own layer, so its outline cuts a 1px dark line across the shoulders
const HOOD = [
  '....MMMMMMM.......',
  '..MMHhhhhhhjj.....',
  '.MHHhhhhhhhhjj....',
  '.MHHhhhhhhhhhjB...',
  '..HHhhhhhhhhhhjB..',
  '..HHhhhhKKKKKKKjB.',
  '..HHhhhKKYYKKYYK..',
  '..HHhhhKKKKKKKPP..',
  '..HHhhhpPPPPPPPP..',
  '...HHhhpPPPPppPp..',
  '....HHhhpPPPPPp...',
];
// torso + legs (leather tunic, crouched stance)
const BODY = [
  '..................',
  '..................',
  '..................',
  '..................',
  '..................',
  '..................',
  '..................',
  '..................',
  '..................',
  '..................',
  '.....NNnnnnl......',
  '....NNnnnnrlB.....',
  '....NNnnnrnlB.....',
  '....NNnnrnnllB....',
  '....NNnrnnnnlB....',
  '....NNrnnnnnlB....',
  '....NrNNNNnnnlB...',
  '....NNnnnnnnnlB...',
  '....rrrrrGGrrrr...',
  '....SSSssssSss....',
  '...SSSs...SSss....',
  '...SSs.....SSss...',
  '..SSs.......SSs...',
  '..SSs........SSs..',
  '.llll........llll.',
  '.NNnN........NNnn.',
  '.NNnnN.......NNnnN',
  'NNNNnn......NNNNnn',
];
// short tattered cape fluttering behind the back (two flutter states), moonlit top edge
const CAPE = [
  ["....MHHh","...MHHhhh","..MHHhhhhh",".MHHhhhhjh","MHHhhhhhjh","HHhhhhhjhh","HHhhhhjhhh","HHhhhhjhh.","HHhhhjhhh.","HHhhhjhh..","HHhhjhh...","H.Hhjh.H..","H..Hh....."],
  ["....MHHh","...MHHhhh","..MHHhhhhh",".MHHhhhhjh","MHHhhhhhjh","HHhhhhhjhh","HHhhhhjhhh","HHhhhhjhh.","HHhhhjhhh.","HHhhhjhh..","HHhhjhh...",".HHhjhH...",".H..hH...."],
];
const QUIVER = ["RV...","VRV..",".VRV.",".UUl.","..UUl","...UU"];
// near arm: sleeve reaching forward to the bow grip
const ARM_F = [
  'nnlllllB.',
  'NNnnnnnll',
  '.rNnnnnll',
];
// draw arm: elbow back, glove at the cheek holding the nock
const ARM_D = [
  '.Nnnlnl',
  'NNnnnll',
];
const SX = 18, SY = 10;
const GRIP = [SX + 21, SY + 12];   // bow grip (front hand)
const NOCK = [SX + 14, SY + 11];   // draw hand / nock point (string pulled slightly)

// ---------- static background (midnight forest silhouettes + mossy stone floor) ----------
const BG = [];
for (let y = 0; y < GH; y++) { BG.push([]); for (let x = 0; x < GW; x++) BG[y].push('2'); }
// moon (upper left) with soft dithered halo
const MX = 11, MY = 8;
for (let y = 0; y < 20; y++) for (let x = 0; x < 24; x++) { const d = Math.hypot(x - MX, y - MY); if (d < 3.6) BG[y][x] = d < 2.4 || (x - MX) + (y - MY) < 1 ? 'M' : 'm'; else if (d < 8 && dth(x, y, (1 - (d - 3.6) / 4.4) * 0.35)) BG[y][x] = '4'; }
for (const [x, y] of [[30, 3], [41, 6], [52, 2], [58, 9], [24, 12], [47, 13], [4, 17]]) BG[y][x] = 'm';
// two layers of pine silhouettes: far (3) then near (4 edge on the moon side)
const pine = (cx, top, w, base, c, edge) => { for (let y = Math.max(0, top); y < FLOOR; y++) { const k = (y - top) / (base - top); const tier = ((y - top) % 6) / 6; const hw = Math.min(w, Math.round(k * w * 0.6 + tier * w * 0.5 + 0.5)); for (let x = cx - hw; x <= cx + hw; x++) if (x >= 0 && x < GW) BG[y][x] = edge && x === cx - hw ? edge : c; } };
for (const [cx, top, w] of [[2, 10, 5], [20, 12, 6], [33, 6, 7], [46, 11, 6], [60, 7, 7]]) pine(cx, top, w, FLOOR, '3');
for (const [cx, top, w] of [[-2, 4, 6], [27, 16, 5], [55, 14, 6]]) pine(cx, top, w, FLOOR, '3', '4');
// low mist band near the forest floor
for (let y = 32; y < FLOOR; y++) for (let x = 0; x < GW; x++) if (BG[y][x] === '3' && dth(x, y, (y - 31) / 14)) BG[y][x] = '4';
// mossy stone floor: bottom 12 rows
for (let y = FLOOR; y < GH; y++) for (let x = 0; x < GW; x++) {
  const row = Math.floor((y - FLOOR) / 4), seamV = (x + row * 7) % 13 === 0, seamH = (y - FLOOR) % 4 === 3;
  let c = y === FLOOR ? '7' : seamH || seamV ? '5' : '6';
  const moss = hsh(x >> 1, (y - FLOOR) >> 1);
  if ((seamH || seamV || y === FLOOR) && moss < 0.45) c = moss < 0.2 ? 'q' : 'Q';            // moss creeping along the seams
  else if (c === '6' && hsh(x, y) < 0.06) c = 'Q';
  BG[y][x] = c;
}

// ---------- compose one frame ----------
function frame(f) {
  const G = BG.map(r => r.slice());
  const bob = f >= 2 ? 1 : 0, bright = f % 2 === 0;
  const AY = NOCK[1] + bob;                                   // arrow row
  // emerald floor glow under the arrow head
  const gx = SX + 25, gy = FLOOR + 3;
  for (let y = FLOOR; y < GH; y++) for (let x = 0; x < GW; x++) { const t = (1 - Math.hypot((x - gx) / 12, (y - gy) / 4.5)) * (bright ? 1 : 0.8); if (t > 0 && !(G[y][x] === '5' && t < 0.5) && dth(x, y, t * 0.85)) G[y][x] = t > 0.55 && dth(x + 1, y, t - 0.4) ? 'f' : 'F'; }
  // contact shadow under the crouched feet
  const foot = SY + BODY.length - 1, scx = SX + 9;
  for (let y = foot - 1; y <= foot + 2; y++) for (let x = 0; x < GW; x++) if (((x + 0.5 - scx) / 12) ** 2 + ((y + 0.5 - (foot + 0.6)) / 1.9) ** 2 < 1) G[y][x] = '1';

  let L = Array.from({ length: GH }, () => new Array(GW).fill('.'));
  const put = (x, y, c) => { if (c !== '.' && x >= 0 && y >= 0 && x < GW && y < GH) L[y][x] = c; };
  const commit = () => {
    for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) if (L[y][x] === '.' && [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => L[y + b] && L[y + b][x + a] && L[y + b][x + a] !== '.')) G[y][x] = '1';
    for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) if (L[y][x] !== '.') G[y][x] = L[y][x];
    L = Array.from({ length: GH }, () => new Array(GW).fill('.'));
  };
  CAPE[f % 2].forEach((row, r) => [...row].forEach((c, i) => put(SX - 2 + i, SY + 9 + r + (r < 11 ? bob : 0), c)));
  QUIVER.forEach((row, r) => [...row].forEach((c, i) => put(SX - 1 + i, SY + 3 + r + bob, c)));
  commit();
  BODY.forEach((row, r) => { const dy = r < 20 ? bob : 0; [...row].forEach((c, i) => put(SX + i, SY + r + dy, c)); });
  commit();
  HOOD.forEach((row, r) => [...row].forEach((c, i) => put(SX + i, SY + r + bob, c)));
  commit();
  // recurve bow (limb offsets from the grip column, upper half; lower half mirrors) — curls forward at the tips
  const LIMB = [[0, 0], [0, -1], [1, -2], [1, -3], [1, -4], [1, -5], [0, -6], [0, -7], [-1, -8], [-1, -9], [0, -10], [1, -11]];
  const [gx0, gy0] = [GRIP[0], GRIP[1] + bob];
  for (const [dx, dy] of LIMB) { put(gx0 + dx, gy0 + dy, Math.abs(dy) > 9 ? 'w' : 'W'); put(gx0 + dx, gy0 - dy, Math.abs(dy) > 9 ? 'w' : 'W'); put(gx0 + dx + 1, gy0 + dy, Math.abs(dy) < 9 ? 'w' : '.'); put(gx0 + dx + 1, gy0 - dy, Math.abs(dy) < 9 ? 'w' : '.'); }
  // bowstring: from each tip back to the nock, drawn slightly (stair-stepped 1-cell line, lit emerald near the arrow)
  const tipU = [gx0 - 1, gy0 - 9], tipD = [gx0 - 1, gy0 + 9], nk = [NOCK[0], NOCK[1] + bob];
  for (const [a, b] of [[tipU, nk], [tipD, nk]]) { const n = Math.abs(b[1] - a[1]); for (let i = 0; i <= n; i++) { const x = Math.round(a[0] + (b[0] - a[0]) * i / n), y = Math.round(a[1] + (b[1] - a[1]) * i / n); put(x, y, i > n - 3 ? 'B' : 'Z'); } }
  // nocked emerald-wind arrow: shaft from the nock past the grip, glowing head
  for (let x = nk[0]; x <= gx0 + 3; x++) put(x, AY, 'n');
  put(nk[0], AY, 'B');
  const HEAD = bright ? [[4, 0, 'E'], [5, 0, 'B'], [4, -1, 'B'], [4, 1, 'B'], [6, 0, 'B']] : [[4, 0, 'B'], [5, 0, 'B'], [4, -1, 'j'], [4, 1, 'j']];
  for (const [dx, dy, c] of HEAD) put(gx0 + dx, AY + dy, c);
  // arms over the bow/string
  ARM_F.forEach((row, r) => [...row].forEach((c, i) => put(SX + 12 + i, SY + 11 + r + bob, c)));
  ARM_D.forEach((row, r) => [...row].forEach((c, i) => put(SX + 9 + i, SY + 11 + r + bob, c)));
  // 1px outline
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) if (L[y][x] === '.' && [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => L[y + b] && L[y + b][x + a] && L[y + b][x + a] !== '.')) G[y][x] = '0';
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) if (L[y][x] !== '.') G[y][x] = L[y][x];
  // arrow aura pixels (bright frames)
  if (bright) for (const [dx, dy] of [[4, -2], [4, 2], [8, 0]]) { const x = gx0 + dx, y = AY + dy; if (G[y][x] < '5' || 'Mm'.includes(G[y][x])) G[y][x] = 'B'; }
  // drifting wind streaks + leaves (1×1 cells, move right with the breeze)
  const DR = [[6, 26, 'v'], [20, 31, 'e'], [40, 22, 'v'], [50, 29, 'e']];
  for (const [x0, y0, c] of DR) { const x = (x0 + f * 3) % GW, y = y0 + (c === 'e' ? [0, 1, 1, 0][f] : 0); if (G[y][x] !== undefined && '234Mm'.includes(G[y][x])) G[y][x] = c; if (c === 'v' && '234'.includes(G[y][(x + 63) % GW])) G[y][(x + 63) % GW] = 'm'; }
  return G;
}

const cv = document.getElementById('c'), ctx = cv.getContext('2d'), buf = document.createElement('canvas');
buf.width = GW; buf.height = GH; const bx = buf.getContext('2d');
const FR = [0, 1, 2, 3].map(frame);
let f = 0, run = true;
function draw() {
  const G = FR[f];
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) { bx.fillStyle = PAL[G[y][x]]; bx.fillRect(x, y, 1, 1); }
  ctx.imageSmoothingEnabled = false; ctx.clearRect(0, 0, cv.width, cv.height); ctx.drawImage(buf, 0, 0, cv.width, cv.height);
  document.getElementById('fl').textContent = 'frame ' + (f + 1) + '/4';
}
draw();
setInterval(() => { if (run) { f = (f + 1) % 4; draw(); } }, 1000 / 6);   // 6 FPS
document.getElementById('pp').onclick = e => { run = !run; e.target.textContent = run ? 'Pause' : 'Play'; };
document.getElementById('st').onclick = () => { run = false; document.getElementById('pp').textContent = 'Play'; f = (f + 1) % 4; draw(); };
window.__frame = i => { run = false; f = i; draw(); };
</script></body></html>
