<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcanist Showcase Card</title>
<style>
:root{--bg:#0c0a14;--card:#14111f;--line:#2b2440;--fg:#e8e4f4;--mut:#8f88a8;--acc:#7ef9ff;--gold:#e0b040}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#0c0a14;--card:#14111f}}
:root[data-theme="dark"]{--bg:#0c0a14}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:14px/1.45 ui-monospace,Consolas,monospace;display:grid;place-items:center;padding:16px}
.card{width:min(100%,544px);background:var(--card);border:2px solid #0b0a14;box-shadow:0 0 0 2px var(--line),0 0 0 4px #0b0a14,0 20px 50px #000c}
canvas{display:block;width:100%;aspect-ratio:4/3;image-rendering:pixelated}
.bar{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;border-top:2px solid #0b0a14}
.n{font-weight:700;letter-spacing:.1em;color:var(--acc)}.t{color:var(--gold);font-size:12px;letter-spacing:.2em}
.ctl{display:flex;gap:8px;justify-content:center;margin-top:12px;color:var(--mut);font-size:12px}
button{font:inherit;color:var(--fg);background:#1c1730;border:1px solid var(--line);padding:4px 10px;cursor:pointer}
</style></head><body>
<div><div class="card"><canvas id="c" width="512" height="384" aria-label="Arcanist mage idle diorama"></canvas>
<div class="bar"><span class="n">ARCANIST</span><span class="t">MAGE</span></div></div>
<div class="ctl"><button id="pp">Pause</button><button id="st">Step</button><span id="fl">frame 1/4</span></div></div>
<script>
// Everything is drawn into ONE 64×48 buffer (1 cell = 1 pixel), then scaled ×8 with smoothing off.
const GW = 64, GH = 48, FLOOR = 36;
const PAL = {
  '0': '#0b0a14', // outline
  '1': '#09080f', // contact shadow
  '2': '#161224', // distant plum
  '3': '#211b36', // arch / pillar
  '4': '#2d2547', // arch edge light (muted)
  '5': '#1e1a28', // floor dark mortar
  '6': '#2c2638', // floor stone
  '7': '#3d3550', // floor stone top edge
  '8': '#141a52', // robe shadow (deep)
  '9': '#26389a', // royal blue
  'A': '#4362d8', // blue light
  'B': '#7ef9ff', // cyan rim light
  'G': '#e0b040', // gold
  'g': '#8a6420', // gold shadow
  'K': '#05040a', // face shadow
  'Y': '#ffe14a', // eyes
  'W': '#f2efe8', // beard
  'w': '#a9a3bf', // beard shadow
  'N': '#4a2a14', // wood shadow
  'n': '#8a5a2a', // wood
  'C': '#33c8f0', // orb halo
  'c': '#bff9ff', // orb light
  'E': '#ffffff', // orb core
  'F': '#1b3446', // floor glow dim
  'f': '#2a5f70', // floor glow bright
};
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const dth = (x, y, t) => t * 16 > BAY[((y & 3) << 2) | (x & 3)] + 0.5;
const hsh = (a, b) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

// ---------- Mage sprite (hand-authored matrix, faces right; '.' = empty) ----------
const BODY = [
  '...8....................',
  '...89...................',
  '....89..................',
  '....899.................',
  '.....899................',
  '.....8999...............',
  '.....89A9B..............',
  '....8899AB..............',
  '....89999AB.............',
  '...889A99AB.............',
  '...8899999AB............',
  '...gGGGGGGGGB...........',
  '..8899999999AB..........',
  '..889999999AAAB.........',
  '8899999999999AAABB......',
  '.88888888999999AAB......',
  '....KKKKKKKKKK..........',
  '....KKKKKYYKYYK.........',
  '..8gKKKKKKKKKKB.........',
  '.889gwWWWWWWWWWB........',
  '.8899gwWWWWWWWWWB.......',
  '.88999gwWWWWWWWB........',
  '.889999gwWWWWWB9........',
  '.8899999gwWWWB99A.......',
  '.88999999gwWB999AB......',
  '.889999999gG9999AAB.....',
  '.8899999999G99999AB.....',
  '88899999999G99999AAB....',
  '88899999999G999999AB....',
  '888999999999G99999AAB...',
  '888999999999G999999AB...',
  '8889999999999G99999AAB..',
  '88GGGGGGGGGGGGGGGGGGGGB.',
  '.ggggggggggggggggggggg..',
];
// sleeve + hand gripping the staff (drawn over staff)
const ARM = [
  '..899A.....',
  '.8999AAB...',
  '.89999AWWB.',
  '..8999AWWB.',
  '....88.....',
];
const SX = 17, SY = 5;          // sprite origin on the grid
const STAFF_X = SX + 20;         // staff column (2px wide: shadow + wood)
const ORB_Y = SY + 4;            // orb center row

// ---------- static background (distant plum gothic arches + stone floor) ----------
const BG = [];
for (let y = 0; y < GH; y++) { BG.push([]); for (let x = 0; x < GW; x++) BG[y].push('2'); }
// pointed gothic arches: pillars with an ogive opening between them
const ARCHES = [[-2, 14], [20, 44], [50, 70]];
for (const [l, r] of ARCHES) {
  const cx = (l + r) / 2, half = (r - l) / 2 - 3, spring = 14;
  for (let y = 0; y < FLOOR; y++) for (let x = Math.max(0, l - 3); x <= Math.min(GW - 1, r + 3); x++) {
    const inX = Math.abs(x + 0.5 - cx);
    // ogive: two circles offset so the top is pointed
    let open = false;
    if (y >= spring) open = inX < half;
    else { const R = half * 1.6, ox = half - R; open = Math.hypot(inX - ox, y - spring) < R && y > 2; }
    const pillar = x < l + 1 || x > r - 1;
    if (!open) BG[y][x] = (pillar && x === l) || (!open && Math.abs(inX - half) < 1 && y >= spring) ? '4' : '3';
    else if (y > FLOOR - 6 && dth(x, y, (y - (FLOOR - 6)) / 10)) BG[y][x] = '3'; // haze at the arch feet
  }
}
// brick seams on the walls (very subtle)
for (let y = 1; y < FLOOR; y += 4) for (let x = 0; x < GW; x++) if (BG[y][x] === '3' && ((x + (y >> 2) * 3) % 7 === 0)) BG[y][x] = '2';
// stone floor: bottom 12 rows
for (let y = FLOOR; y < GH; y++) for (let x = 0; x < GW; x++) {
  const row = Math.floor((y - FLOOR) / 4), off = row * 5, seamV = (x + off) % 11 === 0, seamH = (y - FLOOR) % 4 === 3;
  let c = '6';
  if (y === FLOOR) c = '7';
  else if (seamH || seamV) c = '5';
  else if (hsh(x >> 1, y) < 0.12) c = '5';
  BG[y][x] = c;
}

// ---------- compose one frame on the 64×48 grid ----------
function frame(f) {
  const G = BG.map(r => r.slice());
  const bob = f >= 2 ? 1 : 0;            // exhale: upper body sinks 1px on frames 3–4
  const bright = f % 2 === 0;            // orb pulses between two states
  // floor glow under the orb (dithered radial, pulses)
  const gx = STAFF_X + 1, gy = FLOOR + 3;
  for (let y = FLOOR; y < GH; y++) for (let x = 0; x < GW; x++) {
    const d = Math.hypot((x - gx) / 14, (y - gy) / 4.5), t = (1 - d) * (bright ? 1 : 0.8);
    if (t <= 0 || G[y][x] === '5' && t < 0.5) continue;
    if (dth(x, y, t * 0.9)) G[y][x] = t > 0.55 && dth(x + 1, y, t - 0.4) ? 'f' : 'F';
  }
  // contact shadow under the robe hem
  const hem = SY + BODY.length - 1, scx = SX + 11;
  for (let y = hem - 1; y <= hem + 2; y++) for (let x = 0; x < GW; x++) if (((x + 0.5 - scx) / 14) ** 2 + ((y + 0.5 - (hem + 0.6)) / 1.9) ** 2 < 1) G[y][x] = '1';

  // character layer (separate so it gets its own 1px outline)
  const L = Array.from({ length: GH }, () => new Array(GW).fill('.'));
  const put = (x, y, c) => { if (c !== '.' && x >= 0 && y >= 0 && x < GW && y < GH) L[y][x] = c; };
  // staff (stays planted on the floor)
  for (let y = ORB_Y + 2; y <= hem + 1; y++) { put(STAFF_X, y, 'N'); put(STAFF_X + 1, y, (y % 5 === 0) ? 'N' : 'n'); }
  put(STAFF_X - 1, ORB_Y + 2, 'g'); put(STAFF_X + 2, ORB_Y + 2, 'G');                   // gold prongs holding the orb
  put(STAFF_X - 1, ORB_Y + 1, 'G'); put(STAFF_X + 2, ORB_Y + 1, 'G');
  // body: rows above the waist bob, robe skirt stays planted
  BODY.forEach((row, r) => { const dy = r < 26 ? bob : 0; [...row].forEach((c, i) => put(SX + i, SY + r + dy, c)); });
  ARM.forEach((row, r) => [...row].forEach((c, i) => put(SX + 11 + i, SY + 19 + r + bob, c)));
  // orb (on top of the staff)
  const ORB = bright
    ? ['.CcC.', 'CcEcC', 'cEEEc', 'CcEcC', '.CcC.']
    : ['.CCC.', 'CcccC', 'CcEcC', 'CcccC', '.CCC.'];
  ORB.forEach((row, r) => [...row].forEach((c, i) => put(STAFF_X - 2 + i + 1, ORB_Y - 2 + r, c)));
  // outline: empty cells touching the character become black
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) if (L[y][x] === '.' && [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => L[y + b] && L[y + b][x + a] && L[y + b][x + a] !== '.')) G[y][x] = '0';
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) if (L[y][x] !== '.') G[y][x] = L[y][x];
  // orb light spilling onto the front edge of the body is already in the matrix (B); halo pixels around the orb when bright
  if (bright) for (const [dx, dy] of [[-4, 0], [5, 0], [0.5, -4], [0.5, 4]]) { const x = Math.round(STAFF_X + 0.5 + dx), y = ORB_Y + dy; if (G[y] && G[y][x] < '4') G[y][x] = 'C'; }
  // 4 arcane sparks drifting up from the orb (1×1 cells, staggered phases)
  const SP = [[-3, 0, 'c'], [3, 1, 'B'], [-1, 2, 'E'], [2, 3, 'C']];
  for (const [dx, ph, c] of SP) { const k = (f + ph) % 4, x = STAFF_X + 1 + dx + (k >= 2 ? (dx > 0 ? 1 : -1) : 0), y = ORB_Y - 4 - k * 2; if (G[y] && G[y][x] !== undefined && G[y][x] < '4') G[y][x] = c; }
  return G;
}

// ---------- blit: 64×48 grid → 512×384 canvas, nearest neighbour ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), buf = document.createElement('canvas');
buf.width = GW; buf.height = GH; const bx = buf.getContext('2d');
ctx.imageSmoothingEnabled = false;
const FR = [0, 1, 2, 3].map(frame);
let f = 0, run = true;
function draw() {
  const G = FR[f];
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) { bx.fillStyle = PAL[G[y][x]]; bx.fillRect(x, y, 1, 1); }
  ctx.imageSmoothingEnabled = false; ctx.clearRect(0, 0, cv.width, cv.height); ctx.drawImage(buf, 0, 0, cv.width, cv.height);
  document.getElementById('fl').textContent = 'frame ' + (f + 1) + '/4';
}
draw();
setInterval(() => { if (run) { f = (f + 1) % 4; draw(); } }, 1000 / 6);   // 6 FPS
document.getElementById('pp').onclick = e => { run = !run; e.target.textContent = run ? 'Pause' : 'Play'; };
document.getElementById('st').onclick = () => { run = false; document.getElementById('pp').textContent = 'Play'; f = (f + 1) % 4; draw(); };
window.__frame = i => { run = false; f = i; draw(); };
</script></body></html>
